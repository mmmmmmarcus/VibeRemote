name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Concurrency diagnostics
        run: swift build -Xswiftc -warn-concurrency -Xswiftc -strict-concurrency=complete
      - name: Validate scripts and metadata
        run: |
          bash -n build.sh create_app_bundle.sh build_audio_driver.sh install.sh scripts/clean-build.sh scripts/prepare-update.sh
          plutil -lint VibeRemote.entitlements
          python3 scripts/test_updates.py
      - name: Clean build caches
        if: always()
        run: ./scripts/clean-build.sh
