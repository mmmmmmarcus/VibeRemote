schema:
  schema_id: vvhisper_pinyin
  name: vvhisper 拼音
  version: '2.0'
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
translator:
  dictionary: vvhisper_lexicon
  enable_sentence: true
  enable_user_dict: false
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/
menu:
  page_size: 8
